  <!-- Directions par niveau -->
<section class="py-16 bg-gray-50">
  <div class="container mx-auto px-4">
    <div class="max-w-6xl mx-auto">

      <!-- Organigramme Timeline -->
      <div class="relative">
        <!-- Ligne verticale gauche -->



        <!-- Vérifie s'il y a des niveaux / directions -->
        <ng-container *ngIf="niveaux() && niveaux().length > 0; else noData">
           <div class="absolute left-6 top-0 bottom-0 w-1 bg-green-200 rounded"></div>

          <!-- Boucle sur les niveaux -->
          <ng-container *ngFor="let niveau of niveaux(); let i = index">
            <div class="relative pl-20 mb-16 flex flex-col items-center">

              <!-- Badge niveau -->
              <div class="absolute left-0 top-4 flex items-center justify-center">
                <div class="w-12 h-12 rounded-full bg-green-600 text-white font-bold flex items-center justify-center shadow-md">
                  {{ i + 1 }}
                </div>
              </div>

              <!-- Cartes des directions -->
              <div class="flex flex-wrap justify-center gap-4">
                <div *ngFor="let direction of (groupedDirections()[niveau] || [])"
                     class="bg-white rounded-2xl p-4 shadow-md border border-gray-100
                     w-52 text-center hover:shadow-lg hover:-translate-y-1 transition-all duration-300">

                  <!-- Affiche uniquement le nom optimisé sur une ligne -->
                  <h4 class="font-semibold text-gray-800 text-sm leading-tight mb-0 truncate">{{ direction.acronym }}</h4>
                </div>
              </div>

            </div>
          </ng-container>

        </ng-container>

        <!-- Fallback si aucune donnée -->
        <ng-template #noData>
          <div class="text-center py-16">
            <svg class="w-16 h-16 text-neutral-300 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z">
              </path>
            </svg>
            <h3 class="text-lg font-medium text-neutral-700 mb-2">Aucune donnée disponible</h3>
          </div>
        </ng-template>

      </div>

    </div>
  </div>

</section>

<div class="overflow-hidden bg-[#04f086] rounded-sm shadow-sm">

  <!-- En-tête -->
  <div
    class="flex items-center justify-between px-8 py-6 text-white cursor-pointer hover:bg-[#4ca58f]"
    (click)="toggleLegende()"
  >
    <span class="text-2xl font-light">
      Légende
    </span>

    <span
      class="text-3xl transition-transform duration-300"
      [class.rotate-90]="legendeOuverte"
    >
      >
    </span>
  </div>


  <!-- Contenu -->
  <div
    *ngIf="legendeOuverte"
    class="px-8 py-8 bg-[#EEF2F7]"
  >

    <div class="grid grid-cols-1 md:grid-cols-2 gap-x-20 gap-y-2 text-[17px] leading-9">

      <!-- Colonne gauche -->
      <div>
        <div *ngFor="let item of legendeGauche">
          <strong>{{ item.sigle }} :</strong>
          {{ item.definition }}
        </div>
      </div>

      <!-- Colonne droite -->
      <div>
        <div *ngFor="let item of legendeDroite">
          <strong>{{ item.sigle }} :</strong>
          {{ item.definition }}
        </div>
      </div>

    </div>

  </div>

</div>
