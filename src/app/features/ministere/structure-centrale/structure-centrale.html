<!-- Bannière -->
<div class="bg-gradient-to-r from-[#00843B] to-[#006B30] py-12">
  <div class="container px-4 mx-auto">
    <h1 class="mb-2 text-3xl font-bold text-white">Structures Centrales</h1>
    <nav class="text-sm text-green-100">
      <a routerLink="/" class="hover:text-white">Accueil</a>
      <span class="mx-2">›</span>
      <a routerLink="/ministere/ministre" class="hover:text-white">Ministère</a>
      <span class="mx-2">›</span>
      <span class="text-white">Structures Centrales</span>
    </nav>
  </div>
</div>
    <section class="py-16 bg-gray-100">
      <div class="container mx-auto px-4">

    <!-- Grille de cartes -->
    <div *ngIf="!loading()" class="grid gap-6 md:grid-cols-2 xl:grid-cols-3">
      <article
        *ngFor="let structure of structuresCentrales()"
        class="flex flex-col justify-between bg-white rounded-2xl border border-slate-100
               shadow-md p-6 transition duration-200 hover:-translate-y-1 hover:shadow-xl
               cursor-pointer"
        [routerLink]="['/structure-centrale', structure.id]"
      >
        <!-- Ligne haute : logo + sigle -->
        <div class="flex items-center gap-4 mb-6">

          <!-- Logo / Photo -->
          <div class="flex-shrink-0 w-16 h-16 rounded-lg overflow-hidden bg-slate-100
                      flex items-center justify-center">
            <img
              *ngIf="structure.photo"
              [src]="getImageUrl(structure.photo)"
              [alt]="structure.nom"
              class="object-contain w-full h-full p-1"
            />
            <!-- Icône ABC par défaut si pas de photo -->
            <svg *ngIf="!structure.photo"
                 class="w-10 h-10 text-emerald-500" fill="none"
                 stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13
                       C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13
                       C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13
                       C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
            </svg>
          </div>

          <!-- Sigle -->
          <span class="text-2xl font-extrabold text-slate-900 tracking-wide">
            {{ structure.sigle }}
          </span>
        </div>

        <!-- Séparateur -->
        <hr class="border-slate-100 mb-4">

        <!-- Nom complet centré -->
        <p class="text-lg font-bold text-center text-slate-600 leading-relaxed">
          {{ structure.nom }}
        </p>

      </article>
    </div>

    <!-- Vide -->
    <div *ngIf="!loading() && structuresCentrales().length === 0"
         class="py-16 text-center text-slate-500">
      Aucune structure centrale disponible.
    </div>

  </div>
</section>
