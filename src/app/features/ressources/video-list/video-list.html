<section class="py-5">

    <div class="container">

        <!-- Titre -->
        <div class="mb-5 text-center">

            <h2 class="fw-bold">
                Médiathèque Vidéos
            </h2>

            <p class="text-muted">
                Découvrez les vidéos publiées par le ministère.
            </p>

        </div>

        <!-- Chargement -->
        @if (loading()) {

            <div class="py-5 text-center">

                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">
                        Chargement...
                    </span>
                </div>

            </div>

        }

        <!-- Liste des vidéos -->
        @else {

            @if (videos().length > 0) {

                <div class="row g-4">

                    @for (video of videos(); track video.id) {

                        <div class="col-lg-6">

                            <div class="border-0 shadow-sm card h-100">

                                <!-- Vidéo YouTube -->
                                @if (video.youtubeUrl) {

                                    <div class="ratio ratio-16x9">

                                        <iframe
                                            [src]="video.youtubeUrl"
                                            title="YouTube video"
                                            frameborder="0"
                                            allowfullscreen>
                                        </iframe>

                                    </div>

                                }

                                <!-- Vidéo locale -->
                                @else {

                                    <video
                                        controls
                                        class="w-100 rounded-top">

                                        <source
                                            [src]="getVideoUrl(video.videoUrl)"
                                            type="video/mp4">

                                        Votre navigateur ne supporte pas la lecture des vidéos.

                                    </video>

                                }

                            </div>

                        </div>

                    }

                </div>

            }

            @else {

                <div class="py-5 text-center">

                    <img
                        src="assets/images/empty.svg"
                        width="180"
                        alt="Aucune vidéo">

                    <h4 class="mt-4">
                        Aucune vidéo disponible
                    </h4>

                    <p class="text-muted">
                        Les vidéos publiées apparaîtront ici.
                    </p>

                </div>

            }

        }

    </div>

</section>
