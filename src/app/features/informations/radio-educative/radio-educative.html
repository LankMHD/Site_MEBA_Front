 <!-- Bannière -->
    <div class="bg-gradient-to-r from-[#00843B] to-[#006B30] py-12">
      <div class="container px-4 mx-auto">
        <h1 class="mb-2 text-3xl font-bold text-white">Radio educative</h1>
        <nav class="text-sm text-green-100">
          <a routerLink="/" class="hover:text-white">Accueil</a>
          <span class="mx-2">›</span>
          <a routerLink="/informations/radio-educative" class="hover:text-white">Informations</a>
          <span class="mx-2">›</span>
          <span class="text-white">Radio educative</span>
        </nav>
      </div>
    </div>

    <!-- Contenu principal -->

    <section class="py-12">
      <div class="container px-4 mx-auto">
        <div class="max-w-3xl p-6 mx-auto bg-white rounded shadow">
          <h2 class="mb-4 text-2xl font-bold">Écoutez la radio éducative</h2>
          
          <div *ngIf="loading" class="flex items-center justify-center py-8">
            <svg class="w-8 h-8 mr-2 text-green-700 animate-spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>

          </div>

          <div *ngIf="!loading">
            <ng-container *ngIf="audio && audio.length > 0; else noAudio">
              <audio controls class="w-full" preload="none">
                <source [src]="radioStreamUrl" type="audio/mpeg">
              </audio>
            </ng-container>

            <ng-template #noAudio>
              <div class="py-8 text-center text-neutral-600"></div>
            </ng-template>
          </div>
        </div>
      </div>
    </section>
