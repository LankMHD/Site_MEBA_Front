<div class="max-w-4xl p-8 mx-auto bg-white rounded-lg shadow">

    <h2 class="mb-8 text-3xl font-bold text-green-700">
        Ajouter un ancien ministre
    </h2>

    <form (ngSubmit)="enregistrer()">

        <!-- Nom -->

        <div class="mb-5">
            <label class="block mb-2 font-semibold">
                Nom
            </label>

            <input
                type="text"
                [(ngModel)]="ancienMinistre.nom"
                name="nom"
                required
                class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-600">
        </div>

        <div class="mb-5">
            <label class="block mb-2 font-semibold">
                Prénom(s)
            </label>

            <input
                type="text"
                [(ngModel)]="ancienMinistre.prenom"
                name="prenom"
                required
                class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-600">
        </div>

        <!-- Fonction -->

        <!-- <div class="mb-5">
            <label class="block mb-2 font-semibold">
                Fonction
            </label>

            <input
                type="text"
                [(ngModel)]="ancienMinistre.fonction"
                name="fonction"
                required
                class="w-full p-3 border rounded-lg">
        </div> -->

        <!-- Dates -->

        <div class="grid grid-cols-2 gap-6 mb-5">

            <div>
                <label class="block mb-2 font-semibold">
                    Date de début
                </label>

                <input
                    type="date"
                    [(ngModel)]="ancienMinistre.dateDebut"
                    name="dateDebut"
                    class="w-full p-3 border rounded-lg">
            </div>

            <div>
                <label class="block mb-2 font-semibold">
                    Date de fin
                </label>

                <input
                    type="date"
                    [(ngModel)]="ancienMinistre.dateFin"
                    name="dateFin"
                    class="w-full p-3 border rounded-lg">
            </div>

        </div>

        <!-- Photo -->

       <div class="mb-5">
          <label class="block mb-2 font-semibold">Photo</label>
          <input
            type="file"
            accept="image/*"
            (change)="onFileSelected($event)"
            class="w-full p-3 border rounded-lg file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-green-50 file:text-green-700 hover:file:bg-green-100">
        </div>

        <!-- Description -->

        <div class="mb-6">

            <label class="block mb-2 font-semibold">
                Description
            </label>

            <textarea
                rows="6"
                [(ngModel)]="ancienMinistre.description"
                name="description"
                class="w-full p-3 border rounded-lg">
            </textarea>

        </div>

        <button
            type="submit"
            class="px-8 py-3 text-white bg-green-700 rounded-lg hover:bg-green-800">
            Enregistrer
        </button>

    </form>

</div>
